server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bizsahayak-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

---
# MySQL Profile (Default: dev)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bizsahayak_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Gauravmishra90}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

---
# H2 Fallback Profile for rapid testing without external DB (Profile: h2)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:bizsahayak_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
# Common App Settings
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: ./uploads

# Official Government API Keys (Environment Variable Overrides Supported)
api:
  setu:
    myscheme:
      api-key: ${API_SETU_MYSCHEME_API_KEY:}
      client-id: ${API_SETU_MYSCHEME_CLIENT_ID:}

gov:
  data:
    api-key: ${GOV_DATA_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
